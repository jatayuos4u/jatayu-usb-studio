<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="jatayu-usb-preview">
    <allow own="in.jatayuos.USBStudio.Inspection"/>
  </policy>
  <policy context="default">
    <allow send_destination="in.jatayuos.USBStudio.Inspection" send_interface="in.jatayuos.USBStudio.Inspection1"/>
  </policy>
</busconfig>
